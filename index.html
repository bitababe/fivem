<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FiveM Server - Đăng Ký Tài Khoản</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background: 
                radial-gradient(circle at 20% 50%, rgba(120, 119, 198, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(255, 119, 198, 0.1) 0%, transparent 50%);
            animation: gradient 15s ease infinite;
        }

        @keyframes gradient {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(-50px, -50px); }
        }

        .container {
            background: rgba(20, 20, 35, 0.95);
            border-radius: 20px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
            overflow: hidden;
            width: 100%;
            max-width: 1000px;
            display: flex;
            min-height: 600px;
            position: relative;
            z-index: 1;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .server-info {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 60px 40px;
            width: 45%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .server-info::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            animation: pulse 8s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.1); opacity: 0.8; }
        }

        .server-info > * {
            position: relative;
            z-index: 1;
        }

        .server-logo {
            font-size: 48px;
            margin-bottom: 20px;
        }

        .server-info h2 {
            font-size: 32px;
            margin-bottom: 15px;
            font-weight: 700;
        }

        .server-info .tagline {
            font-size: 16px;
            opacity: 0.9;
            margin-bottom: 40px;
        }

        .feature {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            font-size: 15px;
        }

        .feature-icon {
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            font-size: 20px;
        }

        .form-section {
            padding: 60px 50px;
            width: 55%;
            background: rgba(30, 30, 45, 0.8);
        }

        .form-header {
            margin-bottom: 40px;
        }

        .form-header h1 {
            color: #fff;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .form-header p {
            color: #9ca3af;
            font-size: 14px;
        }

        .tabs {
            display: flex;
            margin-bottom: 35px;
            background: rgba(20, 20, 35, 0.6);
            border-radius: 12px;
            padding: 5px;
        }

        .tab {
            flex: 1;
            padding: 12px 0;
            text-align: center;
            cursor: pointer;
            color: #9ca3af;
            font-weight: 600;
            transition: all 0.3s;
            border-radius: 8px;
            font-size: 14px;
        }

        .tab.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .form {
            display: none;
        }

        .form.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #e5e7eb;
            font-weight: 500;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(20, 20, 35, 0.6);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            font-size: 14px;
            color: #fff;
            transition: all 0.3s;
        }

        input::placeholder {
            color: #6b7280;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
            background: rgba(20, 20, 35, 0.8);
        }

        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            padding: 14px;
            border-radius: 10px;
            margin-bottom: 25px;
            font-size: 14px;
            display: none;
            font-weight: 500;
        }

        .message.success {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .message.error {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            margin-top: 15px;
        }

        .checkbox-group input[type="checkbox"] {
            width: auto;
            margin-right: 8px;
        }

        .checkbox-group label {
            margin-bottom: 0;
            font-size: 13px;
            color: #9ca3af;
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                max-width: 500px;
            }

            .server-info, .form-section {
                width: 100%;
            }

            .server-info {
                padding: 40px 30px;
            }

            .form-section {
                padding: 40px 30px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="server-info">
            <div class="server-logo">🎮</div>
            <h2>FiveM Server</h2>
            <p class="tagline">Tham gia cộng đồng roleplay hàng đầu!</p>
            
            <div style="margin-top: 30px;">
                <div class="feature">
                    <div class="feature-icon">👥</div>
                    <div>Cộng đồng hoạt động 24/7</div>
                </div>
                <div class="feature">
                    <div class="feature-icon">🚗</div>
                    <div>Xe cộ & nhà cửa độc quyền</div>
                </div>
                <div class="feature">
                    <div class="feature-icon">💼</div>
                    <div>Hệ thống nghề nghiệp đa dạng</div>
                </div>
                <div class="feature">
                    <div class="feature-icon">⚡</div>
                    <div>Server tốc độ cao, ít lag</div>
                </div>
            </div>
        </div>

        <div class="form-section">
            <div class="form-header">
                <h1>Chào mừng đến với Server</h1>
                <p>Tạo tài khoản hoặc đăng nhập để bắt đầu</p>
            </div>

            <div class="tabs">
                <div class="tab active" onclick="switchTab('login')">Đăng Nhập</div>
                <div class="tab" onclick="switchTab('register')">Đăng Ký</div>
            </div>

            <div id="message" class="message"></div>

            <form id="loginForm" class="form active" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Username hoặc Email</label>
                    <input type="text" id="loginUsername" placeholder="Nhập username hoặc email" required>
                </div>
                <div class="form-group">
                    <label>Mật khẩu</label>
                    <input type="password" id="loginPassword" placeholder="Nhập mật khẩu" required>
                </div>
                <button type="submit" class="btn" id="loginBtn">Đăng Nhập</button>
            </form>

            <form id="registerForm" class="form" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label>Username (Game Name)</label>
                    <input type="text" id="regUsername" placeholder="Chọn tên nhân vật của bạn" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="regEmail" placeholder="email@example.com" required>
                </div>
                <div class="form-group">
                    <label>Discord ID (Optional)</label>
                    <input type="text" id="regDiscord" placeholder="YourName#1234">
                </div>
                <div class="form-group">
                    <label>Mật khẩu</label>
                    <input type="password" id="regPassword" placeholder="Tối thiểu 6 ký tự" required>
                </div>
                <div class="form-group">
                    <label>Xác nhận mật khẩu</label>
                    <input type="password" id="regConfirmPassword" placeholder="Nhập lại mật khẩu" required>
                </div>
                
                <div class="checkbox-group">
                    <input type="checkbox" id="agreeTerms" required>
                    <label for="agreeTerms">Tôi đồng ý với điều khoản sử dụng server</label>
                </div>

                <button type="submit" class="btn" id="registerBtn">Tạo Tài Khoản</button>
            </form>
        </div>
    </div>

    <script>
        // ⚙️ CẤU HÌNH API - Thay đổi URL này khi deploy
        const API_URL = 'http://localhost:3000/api';

        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.form').forEach(f => f.classList.remove('active'));
            
            if (tab === 'login') {
                document.querySelector('.tab:first-child').classList.add('active');
                document.getElementById('loginForm').classList.add('active');
            } else {
                document.querySelector('.tab:last-child').classList.add('active');
                document.getElementById('registerForm').classList.add('active');
            }
            hideMessage();
        }

        function showMessage(text, type) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = `message ${type}`;
            msg.style.display = 'block';
        }

        function hideMessage() {
            document.getElementById('message').style.display = 'none';
        }

        async function handleRegister(e) {
            e.preventDefault();
            hideMessage();

            const username = document.getElementById('regUsername').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const discord = document.getElementById('regDiscord').value.trim();
            const password = document.getElementById('regPassword').value;
            const confirmPassword = document.getElementById('regConfirmPassword').value;

            if (password !== confirmPassword) {
                showMessage('❌ Mật khẩu xác nhận không khớp!', 'error');
                return;
            }

            const registerBtn = document.getElementById('registerBtn');
            registerBtn.disabled = true;
            registerBtn.textContent = 'Đang xử lý...';

            try {
                const response = await fetch(`${API_URL}/register`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username,
                        email,
                        discord,
                        password
                    })
                });

                const data = await response.json();

                if (data.success) {
                    showMessage('✅ ' + data.message, 'success');
                    document.getElementById('registerForm').reset();
                    setTimeout(() => {
                        switchTab('login');
                        document.getElementById('loginUsername').value = username;
                    }, 2000);
                } else {
                    showMessage('❌ ' + data.message, 'error');
                }
            } catch (error) {
                showMessage('❌ Lỗi kết nối server: ' + error.message, 'error');
            } finally {
                registerBtn.disabled = false;
                registerBtn.textContent = 'TẠO TÀI KHOẢN';
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            hideMessage();

            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;

            const loginBtn = document.getElementById('loginBtn');
            loginBtn.disabled = true;
            loginBtn.textContent = 'Đang xử lý...';

            try {
                const response = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username,
                        password
                    })
                });

                const data = await response.json();

                if (data.success) {
                    showMessage('✅ ' + data.message, 'success');
                    document.getElementById('loginForm').reset();
                    
                    setTimeout(() => {
                        const user = data.user;
                        alert(`🎮 Chào mừng ${user.username}!\n\n` +
                              `Email: ${user.email}\n` +
                              `Discord: ${user.discord || 'Chưa liên kết'}\n` +
                              `Whitelist: ${user.whitelisted ? 'Đã kích hoạt' : 'Chưa kích hoạt'}\n` +
                              `Vai trò: ${user.role}\n\n` +
                              `Hãy vào server và bắt đầu chơi!`);
                    }, 500);
                } else {
                    showMessage('❌ ' + data.message, 'error');
                }
            } catch (error) {
                showMessage('❌ Lỗi kết nối server: ' + error.message, 'error');
            } finally {
                loginBtn.disabled = false;
                loginBtn.textContent = 'ĐĂNG NHẬP';
            }
        }
    </script>
</body>
</html>
